services:
  # Aplicação Python (menu interativo de CEPs).
  # Uso:  docker compose run --rm app
  app:
    image: python:3.12-slim
    working_dir: /app/buscacep
    command: python main.py
    environment:
      # main.py faz "from buscacep.converter import ...", então a pasta
      # pai (/app) precisa estar no path para achar o pacote "buscacep".
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
    volumes:
      # Código e arquivos de dados (ceps.json / novo.json) persistem no host.
      - .:/app/buscacep
    stdin_open: true   # necessário para input() do menu
    tty: true
