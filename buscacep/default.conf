server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Somente leitura: publica apenas a base consolidada gerada pelo Python.
    location = / {
        return 302 /ceps.json;
    }

    location = /ceps.json {
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "no-store";
    }

    location / {
        return 404;
    }
}
