services:
  # Aplicação Python (menu interativo de CEPs, com consulta ao ViaCEP).
  # Uso:  docker compose run --rm app
  app:
    image: python:3.12-slim
    working_dir: /app
    command: python main.py
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
    volumes:
      # Código e base local (ceps.json) persistem no host.
      - .:/app
    stdin_open: true   # necessário para input() do menu
    tty: true
    # Acesso à internet (para chamar viacep.com.br) já vem habilitado
    # na rede padrão do Docker; nenhuma configuração extra é necessária.
